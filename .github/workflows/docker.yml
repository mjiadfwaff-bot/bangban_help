name: docker

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      version: ${{ steps.vars.outputs.version }}
      run_url: ${{ steps.vars.outputs.run_url }}
      image_name: ${{ steps.vars.outputs.image_name }}
      tags: ${{ steps.vars.outputs.tags }}
      primary_tag: ${{ steps.vars.outputs.primary_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute version and image name
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            TAGS="${IMAGE_NAME}:${VERSION}"$'\n'"${IMAGE_NAME}:latest"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            VERSION="develop-${GITHUB_SHA::7}"
            TAGS="${IMAGE_NAME}:${VERSION}"$'\n'"${IMAGE_NAME}:develop-latest"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            VERSION="main-${GITHUB_SHA::7}"
            TAGS="${IMAGE_NAME}:${VERSION}"$'\n'"${IMAGE_NAME}:latest"
          else
            VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
            TAGS="${IMAGE_NAME}:${VERSION}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "image_name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${IMAGE_NAME}:${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tags<<EOF" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install gf CLI
        run: go install github.com/gogf/gf/cmd/gf/v2@v2.10.0

      - name: Build application
        working-directory: server
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/manifest/docker/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

  notify:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_NOTIFY_BOT_TOKEN }}
      TG_CHAT_ID: ${{ vars.TG_NOTIFY_CHAT_ID || '6197001575' }}
    steps:
      - name: Send Telegram notification
        if: ${{ env.TG_BOT_TOKEN != '' }}
        shell: bash
        env:
          BUILD_STATUS: ${{ needs.build-and-push.result }}
          VERSION: ${{ needs.build-and-push.outputs.version || github.ref_name }}
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name || 'ghcr.io/unknown' }}
          PRIMARY_TAG: ${{ needs.build-and-push.outputs.primary_tag || 'N/A' }}
          RUN_URL: ${{ needs.build-and-push.outputs.run_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          if [[ "${BUILD_STATUS}" == "success" ]]; then
            STATUS_TEXT="✅ Docker 构建成功"
          elif [[ "${BUILD_STATUS}" == "cancelled" ]]; then
            STATUS_TEXT="⚠️ Docker 构建已取消"
          else
            STATUS_TEXT="❌ Docker 构建失败"
          fi
          MESSAGE=$(cat <<EOF
          ${STATUS_TEXT}

          分支/版本: ${VERSION}
          镜像: ${IMAGE_NAME}
          主标签: ${PRIMARY_TAG}
          构建地址: ${RUN_URL}
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" > /dev/null
