name: docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install gf CLI
        run: go install github.com/gogf/gf/cmd/gf@v2.10.0

      - name: Build application
        working-directory: server
        run: make build

      - name: Set docker tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tags="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${IMAGE_NAME}:${GITHUB_REF_NAME}"$'\n'"${IMAGE_NAME}:latest"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            tags="${IMAGE_NAME}:latest"$'\n'"${IMAGE_NAME}:sha-${GITHUB_SHA}"
          fi
          echo "tags<<EOF" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${tags}" >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/manifest/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
